version: '3.8'

services:
  api-gateway:
    build:
      context: ../
      dockerfile: infra/Dockerfile.gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - core-backend
      - ai-ml-service
      - audit-logging

  auth-service:
    build:
      context: ../
      dockerfile: infra/Dockerfile.auth
    ports:
      - "8001:8001"

  core-backend:
    build:
      context: ../
      dockerfile: infra/Dockerfile.core
    ports:
      - "8002:8002"

  ai-ml-service:
    build:
      context: ../
      dockerfile: infra/Dockerfile.aiml
    ports:
      - "8003:8003"

  audit-logging:
    build:
      context: ../
      dockerfile: infra/Dockerfile.audit
    ports:
      - "8004:8004"
