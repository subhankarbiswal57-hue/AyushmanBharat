name: Ayushman Bharat CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic python-dotenv pyjwt bcrypt passlib scikit-learn joblib httpx pytest requests

    - name: Train Clinical Triage ML Model
      run: |
        python ai_ml/models/train.py

    - name: Run End-to-End Test Suite
      run: |
        python -m unittest discover -s tests -p "*test*.py"
